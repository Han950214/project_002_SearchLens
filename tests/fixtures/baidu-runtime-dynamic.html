<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Baidu dynamic runtime fixture</title>
  </head>
  <body>
    <div id="head">
      <form id="form"><input id="kw" value="微信官网"></form>
    </div>
    <div id="s_tab">
      <a class="cur">网页</a>
      <a>图片</a>
    </div>
    <main id="container">
      <div id="content_left">
        <div class="c-container" data-testid="primary">
          <h3 class="t"><a href="https://weixin.qq.com/">微信官网</a></h3>
          <span class="c-showurl">weixin.qq.com</span>
          <span class="c-abstract">微信官方网站入口。</span>
        </div>
        <div class="c-container" data-testid="secondary">
          <h3 class="t"><a href="https://support.qq.com/">腾讯客服</a></h3>
          <span class="c-showurl">support.qq.com</span>
          <span class="c-abstract">腾讯产品帮助中心。</span>
        </div>
      </div>
    </main>
  </body>
</html>
