<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SearchLens CN</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="popup-container">
    <header class="popup-header">
      <h1 class="popup-title">🔍 SearchLens CN</h1>
      <span class="popup-version">v0.1</span>
    </header>

    <main class="popup-body">
      <div class="popup-status" id="status-area">
        <span class="status-indicator status-active"></span>
        <span class="status-text">SearchLens 已启用</span>
      </div>

      <p class="popup-description">
        在百度搜索页优先提示官网、官方下载和可信来源。
      </p>

      <div class="popup-actions">
        <button id="open-options-btn" class="popup-btn popup-btn-primary">
          ⚙ 打开设置
        </button>
      </div>
    </main>

    <footer class="popup-footer">
      <small>SearchLens CN — 本地优先，不上传搜索数据</small>
    </footer>
  </div>

  <script type="module" src="./main.ts"></script>
</body>
</html>
