<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SearchLens CN — 设置</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="options-container">
    <header class="options-header">
      <h1>🔍 SearchLens CN 设置</h1>
    </header>

    <main class="options-body">
      <!-- Enable / Disable -->
      <section class="options-section">
        <h2>基本设置</h2>
        <div class="option-row">
          <label class="option-label" for="enabled-toggle">
            <span class="option-title">启用 SearchLens</span>
            <span class="option-desc">在百度搜索页显示推荐区</span>
          </label>
          <label class="toggle-switch">
            <input type="checkbox" id="enabled-toggle" />
            <span class="toggle-slider"></span>
          </label>
        </div>
        <div class="option-row">
          <label class="option-label" for="rec-limit-select">
            <span class="option-title">推荐结果数量</span>
            <span class="option-desc">面板中每次显示的建议条数</span>
          </label>
          <select id="rec-limit-select" class="options-select">
            <option value="3">3 条</option>
            <option value="5" selected>5 条</option>
          </select>
        </div>
      </section>

      <!-- Scoring & Display -->
      <section class="options-section">
        <h2>评分与显示</h2>
        <div class="option-row">
          <label class="option-label" for="show-confidence-toggle">
            <span class="option-title">显示可信度标签</span>
            <span class="option-desc">在每个推荐项旁显示高/中/低可信标签</span>
          </label>
          <label class="toggle-switch">
            <input type="checkbox" id="show-confidence-toggle" checked />
            <span class="toggle-slider"></span>
          </label>
        </div>
        <div class="option-row">
          <label class="option-label" for="show-reasons-toggle">
            <span class="option-title">显示评分理由</span>
            <span class="option-desc">显示每条推荐的主要原因</span>
          </label>
          <label class="toggle-switch">
            <input type="checkbox" id="show-reasons-toggle" checked />
            <span class="toggle-slider"></span>
          </label>
        </div>
        <div class="option-row">
          <label class="option-label" for="warn-download-toggle">
            <span class="option-title">第三方下载站警告</span>
            <span class="option-desc">对第三方下载网站显示风险提示</span>
          </label>
          <label class="toggle-switch">
            <input type="checkbox" id="warn-download-toggle" checked />
            <span class="toggle-slider"></span>
          </label>
        </div>
      </section>

      <!-- Domain Preferences -->
      <section class="options-section" id="domain-prefs-section">
        <h2>域名偏好管理</h2>
        <p class="section-desc">管理你对各来源域名的偏好设置。提升的域名在评分中会获得加分。</p>
        <div id="domain-prefs-list" class="domain-prefs-list">
          <p class="empty-hint">暂无自定义偏好。</p>
        </div>
      </section>

      <!-- Privacy -->
      <section class="options-section">
        <h2>隐私说明</h2>
        <div class="privacy-info">
          <p>SearchLens CN 是本地优先的浏览器扩展：</p>
          <ul>
            <li>✅ 不上传搜索词</li>
            <li>✅ 不上传搜索结果</li>
            <li>✅ 不上传用户偏好</li>
            <li>✅ 不记录完整浏览历史</li>
            <li>✅ 不接远程 AI</li>
            <li>✅ 所有偏好只保存在您的本地浏览器中</li>
          </ul>
        </div>
      </section>

      <!-- Data Management -->
      <section class="options-section">
        <h2>数据管理</h2>
        <div class="option-row">
          <button id="export-btn" class="options-btn">📤 导出设置</button>
          <button id="import-btn" class="options-btn">📥 导入设置</button>
          <button id="reset-btn" class="options-btn options-btn-danger">🔄 重置所有设置</button>
        </div>
        <div id="data-status" class="data-status" hidden></div>
      </section>

      <!-- About -->
      <section class="options-section">
        <h2>关于</h2>
        <p class="about-text">
          SearchLens CN v0.1<br />
          帮助您在百度搜索中快速识别官网、官方下载和可信来源。
        </p>
      </section>
    </main>
  </div>

  <script type="module" src="./main.ts"></script>
</body>
</html>
