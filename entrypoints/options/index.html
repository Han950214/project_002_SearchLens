<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SearchLens CN — 设置</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="options-shell">
    <header class="options-header">
      <div class="brand-mark" aria-hidden="true">SL</div>
      <div>
        <p class="eyebrow">SEARCHLENS CN · v0.3</p>
        <h1>搜索结果辅助设置</h1>
        <p>管理推荐显示与本地域名偏好。所有设置仅保存在当前浏览器中。</p>
      </div>
    </header>

    <main class="options-body">
      <section class="options-section">
        <div class="section-heading">
          <div><p class="section-kicker">显示</p><h2>推荐面板</h2></div>
        </div>
        <div class="option-row">
          <label class="option-label" for="enabled-toggle">
            <span class="option-title">启用 SearchLens</span>
            <span class="option-desc">在百度网页搜索页显示独立的推荐面板</span>
          </label>
          <label class="toggle-switch"><input type="checkbox" id="enabled-toggle" /><span class="toggle-slider"></span></label>
        </div>
        <div class="option-row">
          <label class="option-label" for="rec-limit-select">
            <span class="option-title">推荐数量</span>
            <span class="option-desc">控制主面板最多显示的推荐条数</span>
          </label>
          <select id="rec-limit-select" class="options-select"><option value="3">3 条</option><option value="5" selected>5 条</option></select>
        </div>
      </section>

      <section class="options-section">
        <div class="section-heading">
          <div><p class="section-kicker">解释</p><h2>可信度辅助信息</h2></div>
        </div>
        <div class="option-row">
          <label class="option-label" for="show-confidence-toggle">
            <span class="option-title">显示可信度</span>
            <span class="option-desc">显示可信度分数和较高 / 中等 / 较低参考标签</span>
          </label>
          <label class="toggle-switch"><input type="checkbox" id="show-confidence-toggle" checked /><span class="toggle-slider"></span></label>
        </div>
        <div class="option-row">
          <label class="option-label" for="show-reasons-toggle">
            <span class="option-title">显示评分理由</span>
            <span class="option-desc">说明官网特征、推广、下载站和用户偏好等信号</span>
          </label>
          <label class="toggle-switch"><input type="checkbox" id="show-reasons-toggle" checked /><span class="toggle-slider"></span></label>
        </div>
        <div class="option-row">
          <label class="option-label" for="warn-download-toggle">
            <span class="option-title">提示第三方下载站</span>
            <span class="option-desc">提醒核对软件官网或官方应用商店，不承诺绝对安全</span>
          </label>
          <label class="toggle-switch"><input type="checkbox" id="warn-download-toggle" checked /><span class="toggle-slider"></span></label>
        </div>
      </section>

      <section class="options-section">
        <div class="section-heading section-heading-actions">
          <div>
            <p class="section-kicker">本地规则</p>
            <h2>域名偏好</h2>
            <p class="section-desc"><span id="domain-pref-count">0</span> 个域名规则。隐藏优先排除，提升和降低会影响推荐顺序。</p>
          </div>
          <button id="clear-domain-prefs-btn" class="options-btn options-btn-danger" type="button">清空域名偏好</button>
        </div>
        <div id="domain-prefs-list" class="domain-groups" aria-live="polite">
          <p class="empty-hint">正在读取本地域名偏好…</p>
        </div>
      </section>

      <section class="options-section privacy-section">
        <div class="section-heading"><div><p class="section-kicker">隐私</p><h2>默认本地处理</h2></div></div>
        <p>SearchLens 不收集或上传搜索词、搜索结果、点击记录、完整浏览历史或域名偏好，也不提供账号、云同步和统计上传。</p>
        <p>可信度仅用于辅助判断，请继续核对原始搜索结果与真实网站域名。</p>
      </section>

      <section class="options-section">
        <div class="section-heading"><div><p class="section-kicker">维护</p><h2>本地数据</h2></div></div>
        <div class="data-actions">
          <button id="export-btn" class="options-btn" type="button">导出设置</button>
          <button id="import-btn" class="options-btn" type="button">导入设置</button>
          <button id="reset-btn" class="options-btn options-btn-danger" type="button">重置全部本地数据</button>
        </div>
      </section>
    </main>
  </div>

  <div id="data-status" class="data-status" role="status" aria-live="polite" hidden></div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
