<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SearchLens CN — 设置</title>
  <script type="module" crossorigin src="/chunks/options-CaHC4e3N.js"></script>
  <link rel="modulepreload" crossorigin href="/chunks/index-Dks-HI8O.js">
  <link rel="stylesheet" crossorigin href="/assets/options-DMojVqlf.css">
</head>
<body>
  <div class="options-container">
    <header class="options-header">
      <h1>🔍 SearchLens CN 设置</h1>
    </header>

    <main class="options-body">
      <!-- Enable / Disable -->
      <section class="options-section">
        <h2>基本设置</h2>
        <div class="option-row">
          <label class="option-label" for="enabled-toggle">
            <span class="option-title">启用 SearchLens</span>
            <span class="option-desc">在百度搜索页显示推荐区</span>
          </label>
          <label class="toggle-switch">
            <input type="checkbox" id="enabled-toggle" checked>
            <span class="toggle-slider"></span>
          </label>
        </div>
      </section>

      <!-- Privacy -->
      <section class="options-section">
        <h2>隐私说明</h2>
        <div class="privacy-info">
          <p>SearchLens CN 是本地优先的浏览器扩展：</p>
          <ul>
            <li>✅ 不上传搜索词</li>
            <li>✅ 不上传搜索结果</li>
            <li>✅ 不上传用户偏好</li>
            <li>✅ 不记录完整浏览历史</li>
            <li>✅ 不接远程 AI</li>
            <li>✅ 所有偏好只保存在您的本地浏览器中</li>
          </ul>
        </div>
      </section>

      <!-- Data Management -->
      <section class="options-section">
        <h2>数据管理</h2>
        <div class="option-row">
          <button id="export-btn" class="options-btn">📤 导出设置</button>
          <button id="import-btn" class="options-btn">📥 导入设置</button>
          <button id="reset-btn" class="options-btn options-btn-danger">🔄 重置所有设置</button>
        </div>
        <div id="data-status" class="data-status" hidden></div>
      </section>

      <!-- About -->
      <section class="options-section">
        <h2>关于</h2>
        <p class="about-text">
          SearchLens CN v0.1<br>
          帮助您在百度搜索中快速识别官网、官方下载和可信来源。
        </p>
      </section>
    </main>
  </div>

</body>
</html>
