<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SearchLens Small Promo</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 440px; height: 280px; margin: 0; overflow: hidden; }
    body { display: grid; place-items: center; color: #fff; background: radial-gradient(circle at 18% 20%, #736bf0 0, #4f46e5 42%, #26327d 100%); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; }
    .glow { position: absolute; width: 210px; height: 210px; right: -58px; bottom: -72px; border: 32px solid rgba(94,234,212,.22); border-radius: 50%; }
    .card { position: relative; display: flex; width: 360px; align-items: center; gap: 22px; }
    img { width: 112px; height: 112px; filter: drop-shadow(0 18px 22px rgba(17,24,39,.26)); }
    h1 { margin: 0; font-size: 34px; letter-spacing: -.03em; }
    p { margin: 8px 0 0; color: #dfe4ff; font-size: 15px; letter-spacing: .02em; }
  </style>
</head>
<body><div class="glow"></div><div class="card"><img src="../../../public/icons/searchlens-128.png" alt=""><div><h1>SearchLens</h1><p>本地可信度参考</p></div></div></body>
</html>
